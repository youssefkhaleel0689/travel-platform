  /api/auth/change-password:
    patch:
      description: |-
        Requires the current password, so a stolen cookie on its own cannot take over the account. The new password goes through the same rules as registration and must differ from the current one. Clears the temporary-password state set by an admin reset (ACC-07a).

        Every other session of the account is signed out (ACC-06); the device that made the change stays logged in.
      operationId: AuthController_changePassword
