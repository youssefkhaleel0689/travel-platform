                    message: The policies have changed since they were shown. Read them again and accept the current version.
                    path: /api/bookings/hotel/6720f1c2a1b2c3d4e5f60718/accept-policies
                    timestamp: '2026-11-12T10:00:00.000Z'
                BOOKING_NOT_AWAITING_PAYMENT:
                  summary: This booking is EXPIRED and no longer awaits payment
                  value:
                    statusCode: 409
                    code: BOOKING_NOT_AWAITING_PAYMENT
                    error: Conflict
                    message: This booking is EXPIRED and no longer awaits payment
                    path: /api/bookings/hotel/6720f1c2a1b2c3d4e5f60718/accept-policies
                    timestamp: '2026-11-12T10:00:00.000Z'
      security:
        - cookie: []
      summary: Accept the policies before paying (PAY-02)
      tags:
        - Payments and policies
  /api/payments:
    post:
      description: |-
        Opens a Stripe PaymentIntent in test mode for one of your PENDING_PAYMENT bookings and returns its clientSecret, which the card form uses to send the card straight to Stripe. No card detail ever reaches this backend.

        The amount comes from the booking, never from the request. The provider's policies must be accepted first (PAY-02), and the hold must not have expired. Calling this again while an attempt is still open returns that attempt instead of opening a second one.

        The booking is confirmed only when the verified Stripe webhook says the payment succeeded.
      operationId: PaymentsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentDto'
        '400':
          description: Invalid body, or Stripe rejected the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 400
                code: VALIDATION_FAILED
                error: Bad Request
                message: Invalid body, or Stripe rejected the request
                path: /api/payments
                timestamp: '2026-11-12T10:00:00.000Z'
        '401':
          description: Not logged in, the cookie is missing or invalid, or the account is not active (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 401
                code: UNAUTHENTICATED
                error: Unauthorized
                message: Authentication required
                path: /api/payments
                timestamp: '2026-11-12T10:00:00.000Z'
        '403':
          description: The role is not allowed (FORBIDDEN), or a password change is pending (PASSWORD_CHANGE_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                FORBIDDEN:
                  summary: You do not have permission to do this
                  value:
                    statusCode: 403
                    code: FORBIDDEN
                    error: Forbidden
                    message: You do not have permission to do this
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
                PASSWORD_CHANGE_REQUIRED:
                  summary: A new password must be set before continuing
                  value:
                    statusCode: 403
                    code: PASSWORD_CHANGE_REQUIRED
                    error: Forbidden
                    message: A new password must be set before continuing
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
        '404':
          description: No booking of that type and id belongs to this account. The same 404 covers a booking that does not exist and one that is not yours, so booking ids cannot be probed (ACC-11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 404
                code: NOT_FOUND
                error: Not Found
                message: Booking not found
                path: /api/payments
                timestamp: '2026-11-12T10:00:00.000Z'
        '409':
          description: The booking is not in a state that can be paid for. Pick the code in the dropdown to see each body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                BOOKING_NOT_AWAITING_PAYMENT:
                  summary: This booking is CONFIRMED and cannot be paid for
                  value:
                    statusCode: 409
                    code: BOOKING_NOT_AWAITING_PAYMENT
                    error: Conflict
                    message: This booking is CONFIRMED and cannot be paid for
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
                HOLD_EXPIRED:
                  summary: The hold on this booking has expired. Start a new booking to reserve the seats or rooms again.
                  value:
                    statusCode: 409
                    code: HOLD_EXPIRED
                    error: Conflict
                    message: The hold on this booking has expired. Start a new booking to reserve the seats or rooms again.
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
                ALREADY_PAID:
                  summary: This booking has already been paid for
                  value:
                    statusCode: 409
                    code: ALREADY_PAID
                    error: Conflict
                    message: This booking has already been paid for
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
                PAYMENT_ATTEMPT_CLOSED:
                  summary: The last payment attempt is closed. Retry it with POST /api/payments/{id}/retry.
                  value:
                    statusCode: 409
                    code: PAYMENT_ATTEMPT_CLOSED
                    error: Conflict
                    message: The last payment attempt is closed. Retry it with POST /api/payments/{id}/retry.
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
                UNSUPPORTED_BOOKING_CURRENCY:
                  summary: Bookings must be priced in USD
                  value:
                    statusCode: 409
                    code: UNSUPPORTED_BOOKING_CURRENCY
                    error: Conflict
                    message: Bookings must be priced in USD
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
        '503':
          description: Payments are switched off on this server, or Stripe itself could not be reached. Nothing was charged either way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                PAYMENTS_UNAVAILABLE:
                  summary: 'Payments are not configured on this server: STRIPE_SECRET_KEY is missing'
                  value:
                    statusCode: 503
                    code: PAYMENTS_UNAVAILABLE
                    error: Service Unavailable
                    message: 'Payments are not configured on this server: STRIPE_SECRET_KEY is missing'
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
                STRIPE_UNAVAILABLE:
                  summary: The payment provider is unavailable, please try again
                  value:
                    statusCode: 503
                    code: STRIPE_UNAVAILABLE
                    error: Service Unavailable
                    message: The payment provider is unavailable, please try again
                    path: /api/payments
                    timestamp: '2026-11-12T10:00:00.000Z'
      security:
        - cookie: []
      summary: Start paying for a booking on hold (PAY-01)
      tags:
        - Payments and policies
