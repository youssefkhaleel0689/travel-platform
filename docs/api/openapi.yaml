        The amount comes from the booking, never from the request. The provider's policies must be accepted first (PAY-02), and the hold must not have expired. Calling this again while an attempt is still open returns that attempt instead of opening a second one.

        The booking is confirmed only when the verified Stripe webhook says the payment succeeded.
      operationId: PaymentsController_create
