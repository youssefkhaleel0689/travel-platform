        userId:
          type: string
          example: 6720f1c2a1b2c3d4e5f60718
        email:
          type: string
          example: taher@example.com
        temporaryPassword:
          type: string
          example: Tmp3f9a2c74e9
          description: Shown once. The account must set its own password at next login before it can use anything else.
        message:
          type: string
          example: Give this password to the account owner. It cannot be shown again.
