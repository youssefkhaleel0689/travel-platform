        hotelId:
          type: string
          example: 6720f1c2a1b2c3d4e5f60718
          description: The one hotel this moderator manages. Required when role is HOTEL_MODERATOR, and rejected otherwise. It must already exist and must not be deactivated.
        password:
          type: string
          example: Welcome2026
          format: password
          description: 'The temporary password, set by the admin. Omit it and the server generates one. Either way it is returned once in the response and the moderator must replace it before it can use anything else (ACC-07a). Same rules as registration: at least 8 characters, with at least one letter and one digit, and at most 72 bytes in UTF-8.'
