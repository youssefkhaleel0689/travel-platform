  /api/admin/audit-logs:
    get:
      description: 'Newest first, pages of 10 (GEN-05). Suspensions, reactivations, password resets, moderator creation, provider deactivation and every moderation decision (hide, restore, delete, dismiss) are recorded. Read-only: rows can never be changed or removed.'
      operationId: AuditLogsController_list
      parameters:
        - name: page
          required: false
          in: query
          description: Page number, starting at 1. Page size is fixed at 10.
          schema:
            minimum: 1
            default: 1
            example: 1
            type: integer
        - name: action
          required: false
          in: query
          schema:
            type: string
            enum:
              - ACCOUNT_SUSPENDED
              - ACCOUNT_REACTIVATED
              - ACCOUNT_PASSWORD_RESET
              - MODERATOR_CREATED
              - PROVIDER_DEACTIVATED
              - PROVIDER_REACTIVATED
              - CONTENT_HIDDEN
              - CONTENT_RESTORED
              - CONTENT_DELETED
              - REPORT_DISMISSED
        - name: entityType
          required: false
          in: query
          schema:
            type: string
            enum:
              - ACCOUNT
              - HOTEL
              - AIRLINE
              - POST
              - COMMENT
              - REVIEW
              - ITINERARY
              - REPORT
        - name: entityId
          required: false
          in: query
          description: Only rows about this post, comment, account, ...
          schema:
            example: 6720f1c2a1b2c3d4e5f60718
            type: string
        - name: actorId
          required: false
          in: query
          description: Only rows written by this admin
          schema:
            example: 6720f1c2a1b2c3d4e5f60701
            type: string
        - name: from
          required: false
          in: query
          description: Only rows at or after this instant (ISO 8601)
          schema:
            format: date-time
            example: '2026-11-01T00:00:00.000Z'
            type: string
        - name: to
          required: false
          in: query
          description: Only rows at or before this instant (ISO 8601)
          schema:
            format: date-time
            example: '2026-11-30T23:59:59.999Z'
            type: string
