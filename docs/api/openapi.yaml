        exists:
          type: boolean
          example: true
          description: False when its author deleted it in the meantime
        moderationState:
          type: string
          enum:
            - VISIBLE
            - HIDDEN
            - DELETED
          example: VISIBLE
        ownerId:
          type: string
          example: 6720f1c2a1b2c3d4e5f60702
        preview:
          type: string
          example: Three days in Luxor
      required:
        - type
        - id
        - exists
    ReportDto:
      type: object
      properties:
        id:
          type: string
          example: 6720f1c2a1b2c3d4e5f60740
        target:
          $ref: '#/components/schemas/ReportedContentDto'
        reason:
          type: string
          enum:
            - SPAM
            - HARASSMENT
            - HATE_SPEECH
            - INAPPROPRIATE
            - MISINFORMATION
            - OTHER
          example: SPAM
        details:
          type: object
          example: null
          nullable: true
        status:
          type: string
          enum:
            - OPEN
            - DISMISSED
            - HIDDEN
            - DELETED
          example: OPEN
        reporterId:
          type: string
          example: 6720f1c2a1b2c3d4e5f60701
        reporterName:
          type: object
          example: Mona Adel
          nullable: true
        reviewerId:
          type: object
          example: null
          nullable: true
        reviewedAt:
          type: object
          example: null
          nullable: true
        createdAt:
          type: string
          example: '2026-11-18T10:00:00.000Z'
      required:
        - id
        - target
        - reason
        - details
        - status
        - reporterId
        - reviewerId
        - reviewedAt
        - createdAt
    ResolveReportDto:
      type: object
      properties:
        decision:
          type: string
          enum:
            - DISMISS
            - HIDE
            - DELETE
          example: HIDE
          description: DISMISS closes the report and leaves the content alone. HIDE makes the content visible only to its author and admins. DELETE removes it for everyone but admins. HIDE and DELETE also close every other open report on the same item.
      required:
        - decision
    ModerationOutcomeDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - POST
            - COMMENT
            - REVIEW
            - ITINERARY
          example: POST
        id:
          type: string
          example: 6720f1c2a1b2c3d4e5f60718
        before:
          type: string
          enum:
            - VISIBLE
            - HIDDEN
            - DELETED
          example: VISIBLE
        after:
          type: string
          enum:
            - VISIBLE
            - HIDDEN
            - DELETED
          example: HIDDEN
        changed:
          type: boolean
          example: true
          description: False when it already was in that state (nothing changed, nothing logged)
        reportsClosed:
          type: number
          example: 2
          description: Open reports on this item that the action closed
      required:
        - type
        - id
        - before
        - after
        - changed
        - reportsClosed
