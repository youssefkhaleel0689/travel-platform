        countryId:
          type: string
          example: EG
          description: Seeded country id (GEN-12).
        description:
          type: string
          example: A riverside hotel ten minutes from downtown Cairo.
          maxLength: 2000
        starClass:
          type: integer
          example: 4
          minimum: 1
          maximum: 5
        amenities:
          example:
            - Free Wi-Fi
            - Pool
            - Airport shuttle
