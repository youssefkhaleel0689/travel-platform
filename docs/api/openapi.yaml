  /api/flights/search:
    get:
      description: Lists SCHEDULED flights of ACTIVE airlines that have not departed, on departureDate at the departure airport, with a cabin that has a free seat for every adult and child (infants sit on a lap). Only the matching cabins are returned. minPrice and maxPrice are inclusive and apply to the price per seat of each cabin. Results sort by lowestPrice, duration or departure time, 10 per page. A ROUND_TRIP also returns the flights back on returnDate, paged with returnPage. Empty items mean no flights were found.
      operationId: FlightSearchController_search
      parameters:
        - name: page
          required: false
          in: query
          description: Page number, starting at 1. Page size is fixed at 10.
          schema:
            minimum: 1
            default: 1
            example: 1
            type: integer
        - name: departureAirportId
          required: true
          in: query
          description: IATA code of a seeded airport (GET /api/airports).
          schema:
            example: CAI
            type: string
        - name: arrivalAirportId
          required: true
          in: query
          description: IATA code of a seeded airport. Must differ from departureAirportId.
          schema:
            example: DXB
            type: string
        - name: departureDate
          required: true
          in: query
          description: Departure date on the calendar of the DEPARTURE airport (YYYY-MM-DD). Not before today there.
          schema:
            example: '2026-12-20'
            type: string
        - name: tripType
          required: false
          in: query
          schema:
            default: ONE_WAY
            type: string
            enum:
              - ONE_WAY
              - ROUND_TRIP
        - name: returnDate
          required: false
          in: query
          description: Only for a ROUND_TRIP, and required there. Date on the calendar of the return flight's departure airport (the outbound arrival airport). Not before departureDate.
          schema:
            example: '2026-12-27'
            type: string
        - name: adults
          required: false
          in: query
          description: Passengers aged 12 or more.
          schema:
            minimum: 1
            maximum: 9
            default: 1
            type: integer
        - name: children
          required: false
          in: query
          description: Passengers aged 2 to 11. adults + children is at most 9.
          schema:
            minimum: 0
            default: 0
            type: integer
        - name: infants
          required: false
          in: query
          description: Passengers under 2. They sit on an adult's lap, so there are at most as many infants as adults.
          schema:
            minimum: 0
            default: 0
            type: integer
        - name: cabin
          required: false
          in: query
          description: Only flights with seats in this cabin.
          schema:
            type: string
            enum:
              - ECONOMY
              - PREMIUM_ECONOMY
              - BUSINESS
              - FIRST
        - name: minPrice
          required: false
          in: query
          description: Inclusive, per seat in USD.
          schema:
            example: '100.00'
            type: string
        - name: maxPrice
          required: false
          in: query
          description: Inclusive, per seat in USD. Not below minPrice.
          schema:
            example: '500.00'
            type: string
        - name: sortBy
          required: false
          in: query
          schema:
            default: price
            type: string
            enum:
              - price
              - duration
              - departureTime
        - name: sortOrder
          required: false
          in: query
          schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
        - name: returnPage
          required: false
          in: query
          description: Page of the return flights (ROUND_TRIP). `page` is the page of the outbound flights.
          schema:
            minimum: 1
            default: 1
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightSearchResponseDto'
        '400':
          description: Validation failed, an airport that is not seeded (UNKNOWN_AIRPORT), or a date before today at the airport the flight leaves from (DEPARTURE_DATE_IN_PAST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    statusCode: 400
                    code: VALIDATION_FAILED
                    error: Bad Request
                    message: Validation failed
                    errors:
                      - field: arrivalAirportId
                        messages:
                          - arrivalAirportId must differ from departureAirportId
                    path: /api/flights/search
                    timestamp: '2026-11-12T10:00:00.000Z'
                UNKNOWN_AIRPORT:
                  summary: 'Unknown airport: XXX'
                  value:
                    statusCode: 400
                    code: UNKNOWN_AIRPORT
                    error: Bad Request
                    message: 'Unknown airport: XXX'
                    path: /api/flights/search
                    timestamp: '2026-11-12T10:00:00.000Z'
                DEPARTURE_DATE_IN_PAST:
                  summary: departureDate must not be before today at CAI
                  value:
                    statusCode: 400
                    code: DEPARTURE_DATE_IN_PAST
                    error: Bad Request
                    message: departureDate must not be before today at CAI
                    errors:
                      - field: departureDate
                        messages:
                          - departureDate must not be before today at CAI
                    path: /api/flights/search
                    timestamp: '2026-11-12T10:00:00.000Z'
      summary: Search flights, one-way or round trip (FLT-11, FLT-12, FLT-15)
      tags:
        - Flights
