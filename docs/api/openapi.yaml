                    timestamp: '2026-11-12T10:00:00.000Z'
        '404':
          description: No such item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 404
                code: CONTENT_NOT_FOUND
                error: Not Found
                message: Content not found
                path: /api/admin/content/post/6720f1c2a1b2c3d4e5f60718
                timestamp: '2026-11-12T10:00:00.000Z'
        '409':
          description: Not allowed from the current state (a deleted item cannot be hidden or restored), or another admin changed it at the same moment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                INVALID_MODERATION_CHANGE:
                  summary: Content that is DELETED cannot be made VISIBLE
                  value:
                    statusCode: 409
                    code: INVALID_MODERATION_CHANGE
                    error: Conflict
                    message: Content that is DELETED cannot be made VISIBLE
                    path: /api/admin/content/post/6720f1c2a1b2c3d4e5f60718
                    timestamp: '2026-11-12T10:00:00.000Z'
                MODERATION_CONFLICT:
                  summary: The content changed at the same time; try again
                  value:
                    statusCode: 409
                    code: MODERATION_CONFLICT
                    error: Conflict
                    message: The content changed at the same time; try again
                    path: /api/admin/content/post/6720f1c2a1b2c3d4e5f60718
                    timestamp: '2026-11-12T10:00:00.000Z'
      security:
        - cookie: []
      summary: Delete any post, comment, review or itinerary (GEN-10)
      tags:
        - Moderation
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: access_token
    access_token:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    FieldErrorDto:
      type: object
      properties:
        field:
          type: string
          example: email
          description: Dotted path, e.g. passengers.0.name
        messages:
          example:
            - email must be an email
          type: array
          items:
            type: string
      required:
        - field
        - messages
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_FAILED
          description: Stable machine-readable code, e.g. NOT_FOUND, SEAT_UNAVAILABLE
        error:
          type: string
          example: Bad Request
          description: HTTP reason phrase
        message:
          type: string
          example: Validation failed
        errors:
          description: Per-field errors; only present for validation and duplicate key errors
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDto'
        details:
          type: object
          additionalProperties: true
          description: Extra structured data for some errors, e.g. lockedUntil for ACCOUNT_LOCKED
        path:
          type: string
          example: /api/auth/register
        timestamp:
          type: string
          example: '2026-11-03T10:00:00.000Z'
      required:
        - statusCode
        - code
        - error
        - message
        - path
        - timestamp
