  /api/itineraries/{id}/flights:
    get:
      description: One way or round trip from originAirportId to any airport in the city of the itinerary's first day. departureDate defaults to the itinerary's start date and returnDate (ROUND_TRIP only) to its last day's date. Passengers, cabin, price range, sorting and paging work as in GET /api/flights/search, which this reuses.
      operationId: ItineraryFlightsController_search
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number, starting at 1. Page size is fixed at 10.
          schema:
            minimum: 1
            default: 1
            example: 1
            type: integer
        - name: tripType
          required: false
          in: query
          schema:
            default: ONE_WAY
            type: string
            enum:
              - ONE_WAY
              - ROUND_TRIP
        - name: adults
          required: false
          in: query
          description: Passengers aged 12 or more.
          schema:
            minimum: 1
            maximum: 9
            default: 1
            type: integer
        - name: children
          required: false
          in: query
          description: Passengers aged 2 to 11. adults + children is at most 9.
          schema:
            minimum: 0
            default: 0
            type: integer
        - name: infants
          required: false
          in: query
          description: Passengers under 2. They sit on an adult's lap, so there are at most as many infants as adults.
          schema:
            minimum: 0
            default: 0
            type: integer
        - name: cabin
          required: false
          in: query
          description: Only flights with seats in this cabin.
          schema:
            type: string
            enum:
              - ECONOMY
              - PREMIUM_ECONOMY
              - BUSINESS
              - FIRST
        - name: minPrice
          required: false
          in: query
          description: Inclusive, per seat in USD.
          schema:
            example: '100.00'
            type: string
        - name: maxPrice
          required: false
          in: query
          description: Inclusive, per seat in USD. Not below minPrice.
          schema:
            example: '500.00'
            type: string
        - name: sortBy
          required: false
          in: query
          schema:
            default: price
            type: string
            enum:
              - price
              - duration
              - departureTime
        - name: sortOrder
          required: false
          in: query
          schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
        - name: returnPage
          required: false
          in: query
          description: Page of the return flights (ROUND_TRIP). `page` is the page of the outbound flights.
          schema:
            minimum: 1
            default: 1
            type: integer
        - name: originAirportId
          required: true
          in: query
          description: IATA code of the airport you fly from (GET /api/airports).
          schema:
            example: CAI
            type: string
        - name: departureDate
          required: false
          in: query
          description: Defaults to the itinerary's start date. On the calendar of the origin airport; not before today there.
          schema:
            example: '2026-12-20'
            type: string
        - name: returnDate
          required: false
          in: query
          description: Only for a ROUND_TRIP. Defaults to the date of the itinerary's last day. On the calendar of the airport the return flight leaves from; not before departureDate.
          schema:
            example: '2026-12-27'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryFlightSearchResponseDto'
        '400':
          description: Validation failed (one entry per invalid field), or a value is not in the seeded reference data or breaks a rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    statusCode: 400
                    code: VALIDATION_FAILED
                    error: Bad Request
                    message: Validation failed
                    errors:
                      - field: originAirportId
                        messages:
                          - originAirportId must be a 3-letter IATA code (for example CAI)
                    path: /api/itineraries/6720f1c2a1b2c3d4e5f60718/flights
                    timestamp: '2026-11-12T10:00:00.000Z'
                UNKNOWN_AIRPORT:
                  summary: 'Unknown airport: XXX'
                  value:
                    statusCode: 400
                    code: UNKNOWN_AIRPORT
                    error: Bad Request
                    message: 'Unknown airport: XXX'
                    path: /api/itineraries/6720f1c2a1b2c3d4e5f60718/flights
                    timestamp: '2026-11-12T10:00:00.000Z'
                ORIGIN_IN_DESTINATION_CITY:
                  summary: originAirportId must not be in dubai, the itinerary's first city
                  value:
