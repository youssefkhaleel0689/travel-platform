          example: 6720f1c2a1b2c3d4e5f60718
          description: The airline or hotel this moderator manages, and only this one
        temporaryPassword:
          type: string
          example: Welcome2026
          description: Shown once. The moderator must set its own password at first login before it can use anything else.
        message:
          type: string
          example: Give this password to the moderator. It cannot be shown again, and it must be changed at first login.
      required:
        - account
        - providerId
        - temporaryPassword
        - message
