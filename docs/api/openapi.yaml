              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    statusCode: 400
                    code: VALIDATION_FAILED
                    error: Bad Request
                    message: Validation failed
                    errors:
                      - field: arrivalAirportId
                        messages:
                          - arrivalAirportId must differ from departureAirportId
                    path: /api/flights/search
                    timestamp: '2026-11-12T10:00:00.000Z'
                UNKNOWN_AIRPORT:
                  summary: 'Unknown airport: XXX'
                  value:
                    statusCode: 400
                    code: UNKNOWN_AIRPORT
                    error: Bad Request
                    message: 'Unknown airport: XXX'
                    path: /api/flights/search
                    timestamp: '2026-11-12T10:00:00.000Z'
                DEPARTURE_DATE_IN_PAST:
                  summary: departureDate must not be before today at CAI
                  value:
                    statusCode: 400
                    code: DEPARTURE_DATE_IN_PAST
                    error: Bad Request
                    message: departureDate must not be before today at CAI
                    errors:
                      - field: departureDate
                        messages:
                          - departureDate must not be before today at CAI
                    path: /api/flights/search
                    timestamp: '2026-11-12T10:00:00.000Z'
      summary: Search flights, one-way or round trip (FLT-11, FLT-12, FLT-15)
      tags:
        - Flights
  /api/flight-bookings/hold:
    post:
      description: Same body as the summary. In one transaction it checks and prices the request again, holds a seat per adult and child on every segment and creates the booking in PENDING_PAYMENT with holdExpiresAt 10 minutes ahead. If any segment is full, no seat is held at all. Then accept the policies (GET and POST /api/bookings/flight/{id}/policies) and pay (POST /api/payments). An unpaid hold expires and its seats are released.
      operationId: FlightBookingsController_hold
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightBookingRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingDto'
        '400':
          description: Validation failed, a passenger type that does not match the date of birth, a cabin the flight does not have, a return flight that does not fit the outbound one, or extra bags the airline or cabin does not allow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    statusCode: 400
                    code: VALIDATION_FAILED
                    error: Bad Request
                    message: Validation failed
                    errors:
                      - field: passengers
                        messages:
                          - passengers must not have more infants than adults
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
                PASSENGER_TYPE_MISMATCH:
                  summary: Passenger types must match their dates of birth on the departure date
                  value:
                    statusCode: 400
                    code: PASSENGER_TYPE_MISMATCH
                    error: Bad Request
                    message: Passenger types must match their dates of birth on the departure date
                    errors:
                      - field: passengers.1.passengerType
                        messages:
                          - passengerType must be CHILD for someone born on 2018-01-01 (age on 2026-12-20)
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
                CABIN_NOT_OFFERED:
                  summary: This flight has no FIRST cabin
                  value:
                    statusCode: 400
                    code: CABIN_NOT_OFFERED
                    error: Bad Request
                    message: This flight has no FIRST cabin
                    errors:
                      - field: outbound.cabin
                        messages:
                          - This flight has no FIRST cabin
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
                ROUND_TRIP_ROUTE_MISMATCH:
                  summary: inbound must fly from DXB to CAI
                  value:
                    statusCode: 400
                    code: ROUND_TRIP_ROUTE_MISMATCH
                    error: Bad Request
                    message: inbound must fly from DXB to CAI
                    errors:
                      - field: inbound.flightId
                        messages:
                          - inbound must fly from DXB to CAI
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
                RETURN_BEFORE_ARRIVAL:
                  summary: inbound must leave after the outbound flight lands
                  value:
                    statusCode: 400
                    code: RETURN_BEFORE_ARRIVAL
                    error: Bad Request
                    message: inbound must leave after the outbound flight lands
                    errors:
                      - field: inbound.flightId
                        messages:
                          - inbound must leave after the outbound flight lands
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
                EXTRA_BAGS_NOT_ALLOWED:
                  summary: Extra bags must fit the airline's policy and the cabin's bag weight
                  value:
                    statusCode: 400
                    code: EXTRA_BAGS_NOT_ALLOWED
                    error: Bad Request
                    message: Extra bags must fit the airline's policy and the cabin's bag weight
                    errors:
                      - field: passengers.0.extraBags
                        messages:
                          - this airline does not sell extra bags
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
        '401':
          description: Not logged in, the cookie is missing or invalid, or the account is not active (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 401
                code: UNAUTHENTICATED
                error: Unauthorized
                message: Authentication required
                path: /api/flight-bookings/hold
                timestamp: '2026-11-12T10:00:00.000Z'
        '403':
          description: The role is not allowed (FORBIDDEN), or a password change is pending (PASSWORD_CHANGE_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                FORBIDDEN:
                  summary: You do not have permission to do this
                  value:
                    statusCode: 403
                    code: FORBIDDEN
                    error: Forbidden
                    message: You do not have permission to do this
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
                PASSWORD_CHANGE_REQUIRED:
                  summary: A new password must be set before continuing
                  value:
                    statusCode: 403
                    code: PASSWORD_CHANGE_REQUIRED
                    error: Forbidden
                    message: A new password must be set before continuing
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
        '404':
          description: No flight has this id (FLIGHT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 404
                code: FLIGHT_NOT_FOUND
                error: Not Found
                message: Flight not found
                errors:
                  - field: outbound.flightId
                    messages:
                      - no flight has this id
                path: /api/flight-bookings/hold
                timestamp: '2026-11-12T10:00:00.000Z'
        '409':
          description: The flight is cancelled, has departed or its airline is deactivated (FLIGHT_NOT_BOOKABLE), or the cabin has fewer free seats than adults and children (SEAT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                FLIGHT_NOT_BOOKABLE:
                  summary: This flight can no longer be booked
                  value:
                    statusCode: 409
                    code: FLIGHT_NOT_BOOKABLE
                    error: Conflict
                    message: This flight can no longer be booked
                    errors:
                      - field: outbound.flightId
                        messages:
                          - this flight can no longer be booked
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
                SEAT_UNAVAILABLE:
                  summary: Only 1 seat left in ECONOMY
                  value:
                    statusCode: 409
                    code: SEAT_UNAVAILABLE
                    error: Conflict
                    message: Only 1 seat left in ECONOMY
                    errors:
                      - field: outbound.cabin
                        messages:
                          - Only 1 seat left in ECONOMY
                    path: /api/flight-bookings/hold
                    timestamp: '2026-11-12T10:00:00.000Z'
      security:
        - access_token: []
      summary: Hold the seats for 10 minutes (FLT-22)
      tags:
        - Flight bookings
