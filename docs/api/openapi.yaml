                    code: ORIGIN_IN_DESTINATION_CITY
                    error: Bad Request
                    message: originAirportId must not be in dubai, the itinerary's first city
                    path: /api/itineraries/6720f1c2a1b2c3d4e5f60718/flights
                    timestamp: '2026-11-12T10:00:00.000Z'
                DEPARTURE_DATE_IN_PAST:
