  /api/hotels/search:
    get:
      description: 'Access: PUBLIC — no login required. Searches active hotels by seeded cityId or countryId that have enough rooms available for the complete requested stay. Supports minimum/maximum price, minimum rating, and sorting.'
      operationId: HotelSearchController_search
      parameters:
        - name: page
          required: false
          in: query
          description: Page number, starting at 1. Page size is fixed at 10.
          schema:
            minimum: 1
            default: 1
            example: 1
            type: integer
        - name: cityId
          required: false
          in: query
          description: Seeded city id. Checked by ReferenceDataService. At least one of cityId / countryId is required.
          schema:
            example: cairo
            type: string
        - name: countryId
          required: false
          in: query
          description: Seeded country id. Checked by ReferenceDataService. At least one of cityId / countryId is required.
          schema:
            example: EG
            type: string
        - name: checkInDate
          required: true
          in: query
          schema:
            example: '2026-12-20'
            type: string
        - name: checkOutDate
          required: true
          in: query
          schema:
            example: '2026-12-23'
            type: string
        - name: guestCount
          required: true
          in: query
          schema:
            example: 2
            type: number
        - name: roomCount
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: minPricePerNight
          required: false
          in: query
          description: Inclusive; price of the cheapest qualifying room
          schema:
            type: string
        - name: maxPricePerNight
          required: false
          in: query
          description: Inclusive
          schema:
            type: string
        - name: minAverageRating
          required: false
          in: query
          description: Unrated hotels are excluded when set
          schema:
            minimum: 1
            maximum: 5
            type: number
        - name: sortBy
          required: false
          in: query
          schema:
            default: price
            type: string
            enum:
              - price
              - rating
        - name: sortOrder
          required: false
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Paginated list of hotels with available rooms
        '400':
          description: Invalid search parameters (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    statusCode: 400
                    code: VALIDATION_FAILED
                    error: Bad Request
                    message: Validation failed
                    errors:
                      - field: checkInDate
                        messages:
                          - checkInDate must be a valid ISO 8601 date
                    path: /api/hotels/search
                    timestamp: '2026-11-12T10:00:00.000Z'
                DESTINATION_REQUIRED:
                  summary: Provide cityId or countryId
                  value:
                    statusCode: 400
                    code: DESTINATION_REQUIRED
                    error: Bad Request
                    message: Provide cityId or countryId
                    path: /api/hotels/search
                    timestamp: '2026-11-12T10:00:00.000Z'
                UNKNOWN_CITY:
                  summary: 'Unknown city: unknown_city'
                  value:
                    statusCode: 400
                    code: UNKNOWN_CITY
                    error: Bad Request
                    message: 'Unknown city: unknown_city'
                    path: /api/hotels/search
                    timestamp: '2026-11-12T10:00:00.000Z'
                UNKNOWN_COUNTRY:
                  summary: 'Unknown country: ZZ'
                  value:
                    statusCode: 400
                    code: UNKNOWN_COUNTRY
                    error: Bad Request
                    message: 'Unknown country: ZZ'
                    path: /api/hotels/search
                    timestamp: '2026-11-12T10:00:00.000Z'
      summary: HTL-11/12 Search available hotels (PUBLIC)
      tags:
        - Hotel search (B2)
