  /api/auth/register:
    post:
      description: 'Public. Creates an ACTIVE account with the USER role; the role cannot be chosen. acceptTerms must be true. The password is stored only as a bcrypt hash (GEN-13). On success the user is logged in: the response sets the httpOnly access_token cookie (30 minutes) and the httpOnly refresh_token cookie (path /api/auth, until the session ends); neither token is ever in the body.'
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Validation failed (field-level errors), including unknown fields such as role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 400
                code: VALIDATION_FAILED
                error: Bad Request
                message: Validation failed
                errors:
                  - field: email
                    messages:
                      - email must be an email
                path: /api/auth/register
                timestamp: '2026-11-12T10:00:00.000Z'
        '409':
          description: Email already registered (EMAIL_ALREADY_REGISTERED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 409
                code: EMAIL_ALREADY_REGISTERED
                error: Conflict
                message: email is already registered
                errors:
                  - field: email
                    messages:
                      - email is already registered
                path: /api/auth/register
                timestamp: '2026-11-12T10:00:00.000Z'
      summary: Register a traveller account (ACC-01)
      tags:
        - auth
  /api/auth/login:
    post:
      description: Public. On success the response sets the httpOnly access_token cookie (30 minutes) and the httpOnly refresh_token cookie (path /api/auth, until the session ends); neither token is ever in the body. A wrong password and an unknown email give the same 401, and the account status is checked only after the password matches. After 5 consecutive wrong passwords the account is locked for 15 minutes (423), and a successful login resets the count.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Validation failed (field-level errors), including unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 400
                code: VALIDATION_FAILED
                error: Bad Request
                message: Validation failed
                errors:
                  - field: password
                    messages:
                      - password should not be empty
                path: /api/auth/login
                timestamp: '2026-11-12T10:00:00.000Z'
        '401':
          description: Wrong email or password (INVALID_CREDENTIALS). The 5th consecutive wrong password gets 423 instead, and so does any attempt while the account is locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 401
                code: INVALID_CREDENTIALS
                error: Unauthorized
                message: invalid email or password
                path: /api/auth/login
                timestamp: '2026-11-12T10:00:00.000Z'
        '403':
          description: Right password, but the account is suspended or deactivated (ACCOUNT_SUSPENDED, ACCOUNT_DEACTIVATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                ACCOUNT_SUSPENDED:
                  summary: account suspended
                  value:
                    statusCode: 403
                    code: ACCOUNT_SUSPENDED
                    error: Forbidden
                    message: account suspended
                    path: /api/auth/login
                    timestamp: '2026-11-12T10:00:00.000Z'
                ACCOUNT_DEACTIVATED:
                  summary: account deactivated
                  value:
                    statusCode: 403
                    code: ACCOUNT_DEACTIVATED
                    error: Forbidden
                    message: account deactivated
                    path: /api/auth/login
                    timestamp: '2026-11-12T10:00:00.000Z'
        '423':
          description: 'Too many failed attempts: the account is locked for 15 minutes'
          headers:
            Retry-After:
              description: Whole seconds until the lock ends (the same moment as details.lockedUntil)
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 423
                code: ACCOUNT_LOCKED
                error: Locked
                message: account locked, try again later
                details:
                  lockedUntil: '2026-11-13T10:15:00.000Z'
                path: /api/auth/login
                timestamp: '2026-11-12T10:00:00.000Z'
      summary: Log in with email and password (ACC-04, ACC-05)
      tags:
        - auth
  /api/auth/refresh:
    post:
      description: 'Public, no body. Uses only the httpOnly refresh_token cookie (path /api/auth) and rotates it: the response sets a new access_token cookie and a new refresh_token cookie for the same session, and the old refresh token stops working at once. Neither token is ever in the body. Any failure (no or unknown cookie, a session that is revoked, idle for 30 minutes or past its end, an account that is not active) gives the same 401 and clears both cookies.'
      operationId: AuthController_refresh
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '401':
          description: No valid refresh token, or the session is no longer valid (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 401
                code: UNAUTHENTICATED
                error: Unauthorized
                message: Authentication required
                path: /api/auth/refresh
                timestamp: '2026-11-12T10:00:00.000Z'
      summary: Get a new access token from the refresh token (ACC-06)
      tags:
        - auth
  /api/auth/logout:
    post:
      description: Public, no body, always 204. Ends the current session found through the access_token cookie or the refresh_token cookie (either is enough), and always clears both cookies. Never fails for a missing or already ended session.
      operationId: AuthController_logout
      parameters: []
      responses:
        '204':
          description: Logged out. Both auth cookies are cleared. Returned whether or not a session existed.
      summary: Log out of the current session (ACC-06)
      tags:
        - auth
