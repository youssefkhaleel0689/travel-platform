                message: Validation failed
                errors:
                  - field: page
                    messages:
                      - page must not be less than 1
                path: /api/hotels
                timestamp: '2026-11-12T10:00:00.000Z'
        '401':
          description: Not logged in, the cookie is missing or invalid, or the account is not active (UNAUTHENTICATED)
          content:
            application/json:
              schema:
