  /api/payments/{id}/retry:
    post:
      description: Opens a fresh PaymentIntent for the same booking, allowed as long as the hold has not expired. A payment that already succeeded is a conflict, and one that is still open is simply returned as it stands.
      operationId: PaymentsController_retry
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 6720f1c2a1b2c3d4e5f60910
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentDto'
        '401':
          description: Not logged in, the cookie is missing or invalid, or the account is not active (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 401
                code: UNAUTHENTICATED
                error: Unauthorized
                message: Authentication required
                path: /api/payments
                timestamp: '2026-11-12T10:00:00.000Z'
        '404':
          description: No payment of that id belongs to this account - the same 404 as one that does not exist (ACC-11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 404
                code: NOT_FOUND
                error: Not Found
                message: Payment not found
                path: /api/payments/6720f1c2a1b2c3d4e5f60910/retry
                timestamp: '2026-11-12T10:00:00.000Z'
        '409':
          description: There is nothing left to retry, or the booking can no longer be paid for. The status is refreshed from Stripe first, so a payment that succeeded while the page was open is reported as ALREADY_PAID rather than charged twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                ALREADY_PAID:
                  summary: This payment already succeeded
                  value:
                    statusCode: 409
                    code: ALREADY_PAID
                    error: Conflict
                    message: This payment already succeeded
                    path: /api/payments/6720f1c2a1b2c3d4e5f60910/retry
                    timestamp: '2026-11-12T10:00:00.000Z'
                HOLD_EXPIRED:
                  summary: The hold on this booking has expired. Start a new booking to reserve the seats or rooms again.
                  value:
                    statusCode: 409
                    code: HOLD_EXPIRED
                    error: Conflict
                    message: The hold on this booking has expired. Start a new booking to reserve the seats or rooms again.
                    path: /api/payments/6720f1c2a1b2c3d4e5f60910/retry
                    timestamp: '2026-11-12T10:00:00.000Z'
                BOOKING_NOT_AWAITING_PAYMENT:
                  summary: This booking is CANCELLED and cannot be paid for
                  value:
                    statusCode: 409
                    code: BOOKING_NOT_AWAITING_PAYMENT
                    error: Conflict
                    message: This booking is CANCELLED and cannot be paid for
                    path: /api/payments/6720f1c2a1b2c3d4e5f60910/retry
                    timestamp: '2026-11-12T10:00:00.000Z'
        '503':
          description: Payments are switched off on this server, or Stripe itself could not be reached. Nothing was charged either way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                PAYMENTS_UNAVAILABLE:
                  summary: 'Payments are not configured on this server: STRIPE_SECRET_KEY is missing'
                  value:
                    statusCode: 503
                    code: PAYMENTS_UNAVAILABLE
                    error: Service Unavailable
                    message: 'Payments are not configured on this server: STRIPE_SECRET_KEY is missing'
                    path: /api/payments/6720f1c2a1b2c3d4e5f60910/retry
                    timestamp: '2026-11-12T10:00:00.000Z'
                STRIPE_UNAVAILABLE:
                  summary: The payment provider is unavailable, please try again
                  value:
                    statusCode: 503
                    code: STRIPE_UNAVAILABLE
                    error: Service Unavailable
                    message: The payment provider is unavailable, please try again
                    path: /api/payments/6720f1c2a1b2c3d4e5f60910/retry
                    timestamp: '2026-11-12T10:00:00.000Z'
      security:
        - cookie: []
      summary: Retry a failed payment (PAY-01)
      tags:
        - Payments and policies
