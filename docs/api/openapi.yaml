  /api/flights/search:
    get:
      description: Lists SCHEDULED flights of ACTIVE airlines that have not departed, on departureDate at the departure airport, with a cabin that has a free seat for every adult and child (infants sit on a lap). Only the matching cabins are returned. minPrice and maxPrice are inclusive and apply to the price per seat of each cabin. Results sort by lowestPrice, duration or departure time, 10 per page. A ROUND_TRIP also returns the flights back on returnDate, paged with returnPage. Empty items mean no flights were found.
      operationId: FlightSearchController_search
      parameters:
        - name: page
          required: false
          in: query
          description: Page number, starting at 1. Page size is fixed at 10.
          schema:
            minimum: 1
            default: 1
            example: 1
            type: integer
        - name: departureAirportId
          required: true
          in: query
          description: IATA code of a seeded airport (GET /api/airports).
          schema:
            example: CAI
            type: string
        - name: arrivalAirportId
          required: true
          in: query
          description: IATA code of a seeded airport. Must differ from departureAirportId.
          schema:
            example: DXB
            type: string
        - name: departureDate
          required: true
          in: query
          description: Departure date on the calendar of the DEPARTURE airport (YYYY-MM-DD). Not before today there.
          schema:
            example: '2026-12-20'
            type: string
        - name: tripType
          required: false
          in: query
          schema:
            default: ONE_WAY
            type: string
            enum:
              - ONE_WAY
              - ROUND_TRIP
        - name: returnDate
          required: false
          in: query
          description: Only for a ROUND_TRIP, and required there. Date on the calendar of the return flight's departure airport (the outbound arrival airport). Not before departureDate.
          schema:
            example: '2026-12-27'
            type: string
        - name: adults
          required: false
          in: query
          description: Passengers aged 12 or more.
          schema:
            minimum: 1
            maximum: 9
            default: 1
            type: integer
        - name: children
          required: false
          in: query
          description: Passengers aged 2 to 11. adults + children is at most 9.
          schema:
            minimum: 0
            default: 0
            type: integer
        - name: infants
          required: false
          in: query
          description: Passengers under 2. They sit on an adult's lap, so there are at most as many infants as adults.
          schema:
            minimum: 0
            default: 0
            type: integer
        - name: cabin
          required: false
          in: query
          description: Only flights with seats in this cabin.
          schema:
            type: string
            enum:
              - ECONOMY
              - PREMIUM_ECONOMY
              - BUSINESS
              - FIRST
        - name: minPrice
          required: false
          in: query
          description: Inclusive, per seat in USD.
          schema:
            example: '100.00'
            type: string
        - name: maxPrice
          required: false
          in: query
          description: Inclusive, per seat in USD. Not below minPrice.
          schema:
            example: '500.00'
