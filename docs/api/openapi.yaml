                    code: ALREADY_PAID
                    error: Conflict
                    message: This payment already succeeded
                    path: /api/payments/6720f1c2a1b2c3d4e5f60910/retry
                    timestamp: '2026-11-12T10:00:00.000Z'
                HOLD_EXPIRED:
                  summary: The hold on this booking has expired. Start a new booking to reserve the seats or rooms again.
                  value:
                    statusCode: 409
                    code: HOLD_EXPIRED
