components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: access_token
    access_token:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    FieldErrorDto:
      type: object
      properties:
        field:
          type: string
          example: email
          description: Dotted path, e.g. passengers.0.name
        messages:
          example:
            - email must be an email
          type: array
          items:
            type: string
      required:
        - field
        - messages
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_FAILED
          description: Stable machine-readable code, e.g. NOT_FOUND, SEAT_UNAVAILABLE
        error:
          type: string
          example: Bad Request
          description: HTTP reason phrase
        message:
          type: string
          example: Validation failed
        errors:
          description: Per-field errors; only present for validation and duplicate key errors
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDto'
        details:
          type: object
          additionalProperties: true
          description: Extra structured data for some errors, e.g. lockedUntil for ACCOUNT_LOCKED
        path:
          type: string
          example: /api/auth/register
        timestamp:
          type: string
          example: '2026-11-03T10:00:00.000Z'
      required:
        - statusCode
        - code
        - error
        - message
        - path
        - timestamp
    CreateHotelDto:
      type: object
      properties:
        name:
          type: string
          example: Nile View Hotel
          maxLength: 100
        address:
          type: string
          example: 12 Corniche El Nil, Garden City
          maxLength: 200
        cityId:
          type: string
          example: cairo
          description: Seeded city id (GEN-12). Must belong to countryId.
        countryId:
          type: string
          example: EG
          description: Seeded country id (GEN-12).
        description:
          type: string
          example: A riverside hotel ten minutes from downtown Cairo.
          maxLength: 2000
        starClass:
          type: integer
          example: 4
          minimum: 1
          maximum: 5
        amenities:
          example:
            - Free Wi-Fi
            - Pool
            - Airport shuttle
          maxItems: 30
          description: Plain strings; trimmed and de-duplicated (case-insensitive) before saving.
          type: array
          items:
            type: string
      required:
        - name
        - address
        - cityId
        - countryId
        - starClass
    HotelPhotoResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 6720f1c2a1b2c3d4e5f60720
        url:
          type: string
          example: /api/hotels/6720f1c2a1b2c3d4e5f60718/photos/6720f1c2a1b2c3d4e5f60720
        mimeType:
          type: string
          example: image/jpeg
          enum:
            - image/jpeg
            - image/png
        sizeBytes:
          type: number
          example: 245678
      required:
        - id
        - url
        - mimeType
        - sizeBytes
    HotelResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 6720f1c2a1b2c3d4e5f60718
        name:
          type: string
          example: Nile View Hotel
        address:
          type: string
          example: 12 Corniche El Nil, Garden City
        cityId:
          type: string
          example: cairo
        countryId:
          type: string
          example: EG
        description:
          type: string
          example: A riverside hotel ten minutes from downtown Cairo.
        starClass:
          type: number
          example: 4
        status:
          type: string
          enum:
            - ACTIVE
            - DEACTIVATED
          example: ACTIVE
        deactivatedAt:
          type: string
          nullable: true
          example: null
        ratingAverage:
          type: number
          nullable: true
          example: 4.5
          description: Average of VISIBLE reviews; null while unrated.
        ratingCount:
          type: number
          example: 12
        photos:
          type: array
          items:
            $ref: '#/components/schemas/HotelPhotoResponseDto'
        amenities:
          example:
            - Free Wi-Fi
            - Pool
          type: array
          items:
            type: string
        createdAt:
          type: string
          example: '2026-11-08T10:00:00.000Z'
        updatedAt:
          type: string
          example: '2026-11-08T10:00:00.000Z'
      required:
        - id
        - name
        - address
        - cityId
        - countryId
        - description
        - starClass
        - status
        - deactivatedAt
        - ratingAverage
        - ratingCount
        - photos
        - amenities
        - createdAt
        - updatedAt
    PageMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        pageSize:
          type: number
          example: 10
        totalItems:
          type: number
          example: 42
        totalPages:
          type: number
          example: 5
          description: 0 when there are no items
        hasNextPage:
          type: boolean
          example: true
        hasPreviousPage:
