          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
        '400':
          description: The new password breaks the rules, or equals the current one (PASSWORD_UNCHANGED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    statusCode: 400
                    code: VALIDATION_FAILED
                    error: Bad Request
                    message: Validation failed
                    errors:
                      - field: newPassword
                        messages:
                          - password must be at least 8 characters
                    path: /api/auth/change-password
                    timestamp: '2026-11-12T10:00:00.000Z'
                PASSWORD_UNCHANGED:
                  summary: The new password must be different from the current one
                  value:
                    statusCode: 400
                    code: PASSWORD_UNCHANGED
                    error: Bad Request
                    message: The new password must be different from the current one
                    path: /api/auth/change-password
                    timestamp: '2026-11-12T10:00:00.000Z'
        '401':
          description: Not logged in (UNAUTHENTICATED), or the current password is wrong (INVALID_CURRENT_PASSWORD)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                statusCode: 401
                code: INVALID_CURRENT_PASSWORD
                error: Unauthorized
                message: Current password is incorrect
                path: /api/auth/change-password
                timestamp: '2026-11-12T10:00:00.000Z'
      security:
        - access_token: []
      summary: Change your own password (ACC-08)
      tags:
        - auth
