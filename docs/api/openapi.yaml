    UpdateFlightDto:
      type: object
      properties:
        departureAirportId:
          type: string
          example: CAI
          description: IATA code of a seeded airport. Can only change while the flight has no booking and no seat hold. If you change it, send departureLocalInput too.
        arrivalAirportId:
          type: string
          example: DXB
          description: IATA code of a seeded airport. Can only change while the flight has no booking and no seat hold. If you change it, send arrivalLocalInput too.
        departureLocalInput:
          type: string
          example: 2026-12-20T09:15
          description: 'New departure time on the clock of the DEPARTURE airport: YYYY-MM-DDTHH:mm, no offset. Stored in UTC. Must be in the future. Passengers with a CONFIRMED booking are notified.'
        arrivalLocalInput:
          type: string
          example: 2026-12-20T15:15
          description: 'New arrival time on the clock of the ARRIVAL airport: YYYY-MM-DDTHH:mm, no offset. Stored in UTC. Must be after the departure when both are compared in UTC. Passengers with a CONFIRMED booking are notified.'
    CreateCabinDto:
      type: object
      properties:
        category:
          type: string
          enum:
            - ECONOMY
            - PREMIUM_ECONOMY
            - BUSINESS
            - FIRST
          example: ECONOMY
          description: Each category can be used once per flight.
        totalSeats:
          type: number
          example: 150
          minimum: 1
          description: Whole number of seats, greater than 0.
        price:
          type: number
          example: 199.99
          description: Price per seat in USD, greater than 0, at most 2 decimals.
        freeBaggageCount:
          type: number
          example: 1
          minimum: 0
          description: Free checked bags per passenger. 0 means no free bag.
        maxBagWeightKg:
          type: number
          example: 23
          minimum: 0.1
          description: Maximum weight of one bag in kg. Extra bags use the same limit (FLT-08).
