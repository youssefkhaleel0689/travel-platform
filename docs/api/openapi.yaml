                error: Not Found
                message: Booking not found
                path: /api/bookings/hotel/6720f1c2a1b2c3d4e5f60718/policies
                timestamp: '2026-11-12T10:00:00.000Z'
        '409':
          description: The terms moved on, or the booking no longer awaits payment. Both mean the acceptance was not stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              examples:
                POLICY_VERSION_MISMATCH:
                  summary: The policies have changed since they were shown. Read them again and accept the current version.
                  value:
                    statusCode: 409
                    code: POLICY_VERSION_MISMATCH
