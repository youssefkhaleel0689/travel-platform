    CreateModeratorDto:
      type: object
      properties:
        name:
          type: string
          example: Omar Fathy
          maxLength: 100
        email:
          type: string
          example: omar@airline.example.com
          maxLength: 254
          description: Stored trimmed and lower-cased. Must not be registered yet.
        role:
          type: string
          enum:
            - AIRLINE_MODERATOR
            - HOTEL_MODERATOR
          example: AIRLINE_MODERATOR
          description: 'Which kind of provider this moderator manages. It also decides which provider id the body has to carry: airlineId or hotelId.'
        airlineId:
          type: string
          example: 6720f1c2a1b2c3d4e5f60718
